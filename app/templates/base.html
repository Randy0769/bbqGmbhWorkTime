<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <title>{{ title }}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/css/dashboard.css') }}">
</head>
<body>
    <header class="site-header">
        <a class="brand" href="/" aria-label="BBQ TimeTracker Startseite"><span class="brand-icon" aria-hidden="true">◷</span> BBQ <span>TimeTracker</span></a>
        <nav class="main-nav" aria-label="Hauptnavigation"><a href="/" {% if request.url.path == '/' %}aria-current="page"{% endif %}>Übersicht</a><a href="/settings" {% if request.url.path == '/settings' %}aria-current="page"{% endif %}>Einstellungen</a></nav>
    </header>
    <main id="main-content">{% block content %}{% endblock %}</main>
</body>
</html>
